# Publishes XPENC Business.
#
# Push a tag like `v1.2.0` — or run it by hand from the Actions tab, which
# releases the branch's HEAD as `v<pubspec version>` and creates that tag —
# and this workflow will:
#   1. check the tag matches the version in pubspec.yaml
#   2. run the full test suite
#   3. build release APKs (one per ABI)
#   4. gate every APK through tool/verify_apk.sh (the libsqlite3.so check)
#   5. publish a GitHub Release with stable asset names + SHA-256 checksums
#
# Download links point at
#   .../releases/latest/download/xpenc-business-arm64-v8a.apk
# so the asset names below must never change once published.

name: Release XPENC Business APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches pubspec version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC="$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d '[:space:]')"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $PUBSPEC."
            echo "Bump pubspec.yaml (and AppInfo — test/branding_test.dart guards it) before tagging."
            exit 1
          fi

      - name: Release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            V="$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d '[:space:]')"
            echo "name=v$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep on its own line, single-quoted. The F-Droid build recipe reads
          # this Flutter version with sed to build against the same toolchain as
          # CI. Don't reformat this line.
          flutter-version: '3.38.9'
          cache: true

      # Every release must be signed with the same permanent key so an
      # install on top of a previous release is recognized as an update
      # instead of a conflicting package (see docs/RELEASING.md). Without
      # this, android/app/build.gradle.kts falls back to a fresh random
      # debug key on every CI run.
      #
      # When the repository has no ANDROID_KEYSTORE_* secrets yet, the build
      # falls back to debug signing (see build.gradle.kts) and the release
      # says so — add the secrets before the release users should keep
      # updating, or later updates will need an uninstall.
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No release keystore secrets — this release is debug-signed."
            echo "note=⚠️ This build is debug-signed: a future release signed with the permanent key will need an uninstall first (back up before)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/xpenc-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/xpenc-release.jks
          EOF
          echo "note=" >> "$GITHUB_OUTPUT"

      # `--enforce-lockfile` refuses to silently rewrite pubspec.lock if it's
      # out of sync with pubspec.yaml — F-Droid's own reproducible build uses
      # the same flag (see docs/fdroid/metadata-com.yash.xpenc.yml), so a
      # drifted lock file must fail *here*, at tag time, not on their side
      # after the tag is already out (GitHub #57).
      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename to stable asset names
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   release/xpenc-business-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/xpenc-business-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      release/xpenc-business-x86_64.apk

      - name: Verify APKs (libsqlite3.so gate)
        run: |
          for apk in release/*.apk; do
            bash tool/verify_apk.sh "$apk"
          done

      - name: Checksums
        working-directory: release
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: "XPENC Business ${{ steps.tag.outputs.name }}"
          files: |
            release/xpenc-business-arm64-v8a.apk
            release/xpenc-business-armeabi-v7a.apk
            release/xpenc-business-x86_64.apk
            release/SHA256SUMS.txt
          make_latest: true
          generate_release_notes: true
          body: |
            **XPENC Business — your money and your business, on your phone.**

            A separate app from XPENC (`com.yash.xpenc.business`): it installs next to it and keeps its own data.

            - 🏪 **Business Books** — Tally-style double-entry accounting: capital invested, loans,
              purchases, sales with GST, expenses, income, investments and assets from plain-language
              forms. Day Book, Ledgers, Trial Balance, Profit & Loss, Balance Sheet, Outstanding,
              GST summary and Stock. Several companies; CSV export.
            - 📅 **Bookings, personalised by business type** — wedding hall / venue, movie theatre,
              hotel, salon / clinic, rentals, turf or your own: your halls / screens / rooms, sessions
              or show times and form fields; per-day availability; no double-booking; advances and
              bills post straight into the books; shareable booking slip.
            - 💳 Everything from XPENC for personal money — accounts, budgets, persons, reports, backups.

            Find the business features under **More → Business Books**.

            | Your phone | Download |
            |---|---|
            | Most phones (2017+) | `xpenc-business-arm64-v8a.apk` |
            | Older 32-bit phones | `xpenc-business-armeabi-v7a.apk` |
            | Emulators | `xpenc-business-x86_64.apk` |

            Verify your download against `SHA256SUMS.txt`.
            ${{ steps.signing.outputs.note }}
            Full history in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.name }}/CHANGELOG.md).
