# Publishes a preview build of XPENC Business (Business Books + Bookings).
#
# Fires on every push to the business feature branch (or by hand) and
# republishes a single rolling pre-release, tagged `business-preview`, so
# there is always exactly one "current business preview" download link.
#
# Deliberately NOT a `v*` tag: release.yml owns those, and its releases are
# marked "latest" — the website's download buttons point at them. A preview
# built from an unmerged branch must never become what every user downloads.
# Once this work is merged to master, tag `v<version>` as usual and
# release.yml publishes the stable release.
#
# Signing: uses the permanent release key when the repository has the
# ANDROID_KEYSTORE_* secrets (so the preview updates in place over a
# release install); otherwise android/app/build.gradle.kts falls back to
# debug signing, which is fine for a sideloaded preview.

name: Business Preview Release

on:
  push:
    branches:
      - "claude/xpenc-tally-features-mobile-*"
      - "business/**"
    paths-ignore:
      - "website/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: business-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  business-preview:
    name: Build, verify & publish business preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true

      - name: Configure release signing (if secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::No release keystore secrets — building with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/xpenc-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/xpenc-release.jks
          EOF

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename to business-preview asset names
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   release/xpenc-business-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/xpenc-business-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      release/xpenc-business-x86_64.apk

      - name: Verify APKs (libsqlite3.so gate)
        run: |
          for apk in release/*.apk; do
            bash tool/verify_apk.sh "$apk"
          done

      - name: Checksums
        working-directory: release
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Version & short SHA
        id: meta
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Publish business preview pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: business-preview
          name: "XPENC Business ${{ steps.meta.outputs.version }} preview (${{ steps.meta.outputs.short }})"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            release/xpenc-business-arm64-v8a.apk
            release/xpenc-business-armeabi-v7a.apk
            release/xpenc-business-x86_64.apk
            release/SHA256SUMS.txt
          generate_release_notes: false
          body: |
            **XPENC Business ${{ steps.meta.outputs.version }} — preview build from `${{ github.ref_name }}`, commit ${{ steps.meta.outputs.short }}.**

            New in this build:
            - 🏪 **Business Books** — Tally-style double-entry accounting: capital invested, loans,
              purchases, sales with GST, expenses, income, investments and assets from plain-language
              forms. Day Book, Ledgers, Trial Balance, Profit & Loss, Balance Sheet, Outstanding,
              GST summary and Stock. Several companies; CSV export.
            - 📅 **Bookings, personalised by business type** — wedding hall / venue, movie theatre,
              hotel, salon / clinic, rentals, turf or your own. Your own halls / screens / rooms,
              sessions or show times and form fields; per-day availability; no double-booking;
              advances and bills post straight into the books; shareable booking slip.

            Find it under **More → Business Books**.

            ⚠️ Preview build — not the stable release. This link always points at the newest preview;
            each push replaces it. Back up your data before installing (Settings → Backup & Restore).

            | Your phone | Download |
            |---|---|
            | Most phones (2017+) | `xpenc-business-arm64-v8a.apk` |
            | Older 32-bit phones | `xpenc-business-armeabi-v7a.apk` |
            | Emulators | `xpenc-business-x86_64.apk` |

            Verify your download against `SHA256SUMS.txt`.
            Pull request: https://github.com/${{ github.repository }}/pull/1
